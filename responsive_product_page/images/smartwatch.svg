<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" class="w-full h-auto drop-shadow-2xl">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Bezel Metallic Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="30%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Heart Rate Wave Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Strap Texture -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="300" cy="300" r="240" fill="url(#bgGlow)"/>

  <!-- Top Strap -->
  <path d="M 230,20 L 370,20 L 350,150 L 250,150 Z" fill="url(#strapGrad)" rx="10"/>
  <!-- Top Strap Grooves -->
  <line x1="245" y1="40" x2="355" y2="40" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
  <line x1="248" y1="65" x2="352" y2="65" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="90" x2="350" y2="90" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Strap -->
  <path d="M 250,450 L 350,450 L 370,580 L 230,580 Z" fill="url(#strapGrad)" rx="10"/>
  <!-- Bottom Strap Grooves -->
  <line x1="250" y1="510" x2="350" y2="510" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
  <line x1="248" y1="535" x2="352" y2="535" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>
  <line x1="245" y1="560" x2="355" y2="560" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

  <!-- Smartwatch Case Outer Bezel -->
  <rect x="170" y="130" width="260" height="340" rx="65" fill="url(#bezelGrad)" stroke="#71717a" stroke-width="2" filter="url(#glow)"/>

  <!-- Crown Button (Right side) -->
  <rect x="430" y="240" width="14" height="60" rx="5" fill="#3f3f46" stroke="#71717a" stroke-width="1"/>
  <line x1="434" y1="250" x2="434" y2="290" stroke="#a1a1aa" stroke-width="2"/>

  <!-- Secondary Button (Right side) -->
  <rect x="430" y="320" width="10" height="40" rx="4" fill="#27272a"/>

  <!-- Inner Bezel Ring -->
  <rect x="182" y="142" width="236" height="316" rx="55" fill="#09090b" stroke="#27272a" stroke-width="3"/>

  <!-- Active Screen Display -->
  <rect x="190" y="150" width="220" height="300" rx="50" fill="url(#screenGrad)"/>

  <!-- UI Header: Date & Battery -->
  <text x="215" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="1">THU, SEP 17</text>
  
  <!-- Battery Icon -->
  <g transform="translate(365, 177)">
    <rect x="0" y="0" width="22" height="12" rx="3" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <rect x="2" y="2" width="14" height="8" rx="1.5" fill="#10b981"/>
    <path d="M 23,4 L 24,4 L 24,8 L 23,8 Z" fill="#a1a1aa"/>
  </g>

  <!-- Main Time Display -->
  <text x="212" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">10:09</text>
  <text x="352" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#06b6d4">AM</text>

  <!-- Activity Progress Rings -->
  <!-- Outer Ring (Move - Cyan) -->
  <circle cx="300" cy="335" r="55" fill="none" stroke="#18181b" stroke-width="8"/>
  <circle cx="300" cy="335" r="55" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="345" stroke-dashoffset="85" stroke-linecap="round" transform="rotate(-90 300 335)"/>

  <!-- Inner Ring (Exercise - Heart Rose) -->
  <circle cx="300" cy="335" r="42" fill="none" stroke="#18181b" stroke-width="8"/>
  <circle cx="300" cy="335" r="42" fill="none" stroke="url(#heartGrad)" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90 300 335)"/>

  <!-- Heart Icon & BPM in Center -->
  <path d="M 300,327 C 297,322 291,322 288,326 C 285,330 286,336 290,340 L 300,349 L 310,340 C 314,336 315,330 312,326 C 309,322 303,322 300,327 Z" fill="#f43f5e"/>
  <text x="300" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">118 <tspan font-size="9" fill="#9ca3af">BPM</tspan></text>

  <!-- Step Count Banner -->
  <g transform="translate(210, 400)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <!-- Flame / Step Icon -->
    <path d="M 22 10 C 22 10 26 15 26 18 C 26 21 23.5 23 21 23 C 18.5 23 16 21 16 18 C 16 14 20 11 20 11 C 20 11 19 14 21 15 C 23 16 22 10 22 10 Z" fill="#06b6d4"/>
    <text x="36" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">8,420 <tspan font-size="11" font-weight="500" fill="#9ca3af">steps</tspan></text>
    <text x="145" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981">84%</text>
  </g>
</svg>
